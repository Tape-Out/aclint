name: aclint
version: 0.1.0
spec: '0.1'
kind: ip
lang: bsv
identity:
  slug: aclint-tapeout-bsv
  display_name: Core-local interrupts and timer
  summary: CLINT and ACLINT from one module, selected by feature.
  category: peripheral
  subcategories:
  - timer
  - interrupt
  ip_family: clint
  integration_profile:
  - apb4-slave
  maturity: planned
contract:
  version: 1
  ctrl:
    shape: flat
    aw: 16
    dw: 32
  irq:
  - name: msip
    kind: level
    width: harts
  - name: mtip
    kind: level
    width: harts
  - name: ssip
    kind: level
    width: harts
params:
  harts:
    type: int
    default: 1
    range:
    - 1
    - 8
features:
  ssip:
    type: bool
    default: false
emit:
- kind: bsv
  package: Aclint
  module: mkAclint
  config_type: AclintCfg
  interface: AclintIfc
  ctrl: regs
  pins:
  - name: pins
    type: AclintPins
- kind: verilog-flat
  bus: apb4
deps:
  hwcore: ^0.1
  amba: ^0.1
